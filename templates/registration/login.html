{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "ログイン" %} | HUVar{% endblock %}
{% block content %}
<h1>{% translate "ログイン" %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% translate "ログイン" %}</button>
</form>
<p>{% translate "アカウントをお持ちでない方は" %}
    <a href="{% url 'accounts:signup' %}">{% translate "新規アカウント登録" %}</a>
    {% translate "（管理者の承認後に利用できます）。" %}</p>
{% endblock %}
